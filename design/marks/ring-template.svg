<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Ring template for family marks">
  <!-- Grid: 240 units, centre 120/120. W = ring width = 10. -->
  <rect width="240" height="240" fill="#FAF9F4"/>
  <!-- Paper ring: W wide, inside the gold ring. Nothing is drawn here. -->
  <circle cx="120" cy="120" r="102" fill="none" stroke="#E7ECF2" stroke-width="10"/>
  <!-- Window: the motif lives inside radius 97 and its base is cut on this circle. -->
  <circle cx="120" cy="120" r="97" fill="none" stroke="#0E2A4D" stroke-width="0.6"/>
  <!-- Side limit: free parts of the motif stay inside radius 92 (W/2 clear of the window). -->
  <circle cx="120" cy="120" r="92" fill="none" stroke="#0E2A4D" stroke-width="0.6" stroke-dasharray="2 3"/>
  <!-- Top limit: the motif's highest point is at y = 38 (1.5 W below the window's top). -->
  <path d="M51 38H189" stroke="#B3261E" stroke-width="0.8" stroke-dasharray="4 3"/>
  <!-- Base zone: below y = 170 the motif may run into the window's edge and is cut there. -->
  <path d="M38.2 170A97 97 0 0 0 201.8 170Z" fill="#0E2A4D" opacity="0.12"/>
  <!-- Gold ring: centre line radius 112, width W. Drawn last, on top. -->
  <circle cx="120" cy="120" r="112" fill="none" stroke="#BC8A45" stroke-width="10"/>
  <g font-family="system-ui, sans-serif" font-size="6.5" fill="#0E2A4D" text-anchor="middle">
    <text x="120" y="33" fill="#B3261E">top limit y = 38</text>
    <text x="120" y="200">base zone: cut on the window</text>
    <text x="120" y="124">window r = 97</text>
    <text x="120" y="134" fill="#526176">free parts inside r = 92</text>
  </g>
</svg>