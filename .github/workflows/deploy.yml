name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish every buildable target to Bunny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require the Bunny key
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          if [ -z "$BUNNY_API_KEY" ]; then
            echo "::error::BUNNY_API_KEY is not available to this repository; add it as an organization or repository secret (ADR-0009)."
            exit 1
          fi
      # The Consulting build renders its profile PDFs in Chromium.
      - name: Install the PDF browser
        run: pnpm --filter @sebastian-websites/consulting exec playwright install --with-deps chromium
      - name: Build all variants
        run: pnpm build
      - name: Provision, publish, and verify
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: node hosting/deploy.ts
