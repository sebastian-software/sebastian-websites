name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check and build
    # GitHub-hosted on purpose: this repository is public, and pull requests from
    # forks must not run on the self-hosted runner. Deployment jobs, which need
    # secrets, are added when the first variant goes live (plan 02, ADR-0009).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: Ardo dates the Software pages from Git (sourceRoot).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run repository checks
        run: pnpm agent:check
      # The Consulting build renders its profile PDFs in Chromium.
      - name: Install the PDF browser
        run: pnpm --filter @sebastian-websites/consulting exec playwright install --with-deps chromium
      - name: Install the Software browser
        run: pnpm --filter @sebastian-websites/software exec playwright install --with-deps chromium
      - name: Build all variants
        run: pnpm build
      # The deployment's pre-upload checks without Bunny credentials: both
      # language builds of every site, compared and SEO-validated together.
      - name: Check the builds before publication
        run: pnpm hosting:plan
      # Test posts built into scratch output at two build times, plus the empty
      # state and the raster-image checks; each fixture build passes the gate.
      - name: Check the blog fixtures
        run: pnpm --filter @sebastian-websites/software check:fixtures
      - name: Verify both Software artifacts before publication
        run: pnpm --filter @sebastian-websites/software check:browser
      # The blog pages of the later fixture build that check:fixtures leaves:
      # posts, next steps, tag archives, and feed links in both languages.
      - name: Verify the blog pages of the fixture build
        run: pnpm --filter @sebastian-websites/software check:browser:fixtures
      - name: Verify the reporting website in both languages
        run: pnpm --filter @sebastian-websites/app-tracking check:browser
